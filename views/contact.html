<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact - TrainTrack AI</title>
  <meta name="description" content="TrainTrack AI: live train disruptions, schedules and machine-learning delay predictions.">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-nav" id="siteNav"></header>
  <main id="main">
    <div class="container">
      <section class="section contact-box" aria-labelledby="contactTitle">
        <h2 id="contactTitle">Contact Us</h2>
        <p class="muted">Have a question or an issue? Send us a message.</p>
        <form id="contactForm" novalidate>
          <div class="field"><label for="cName">Your name</label><input id="cName" name="name" type="text" autocomplete="name" required minlength="2" maxlength="80"></div>
          <div class="field"><label for="cEmail">Email</label><input id="cEmail" name="email" type="email" autocomplete="email" required maxlength="254"></div>
          <div class="field"><label for="cMessage">Message</label><textarea id="cMessage" name="message" rows="5" required minlength="10" maxlength="2000"></textarea><div class="hint">10 to 2000 characters.</div></div>
          <button class="btn" type="submit">Send Message</button>
          <div id="contactMsg" class="form-msg" role="status" aria-live="polite"></div>
        </form>
      </section>
    </div>
  </main>
  <footer>© 2026 TrainTrack AI</footer>
  <script src="/js/common.js"></script>
  <script src="/js/contact.js"></script>
</body>
</html>
