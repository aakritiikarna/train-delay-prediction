<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact - TrainTrack AI</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <nav>
    <div class="logo">TrainTrack AI</div>
    <div>
      <a href="/">Home</a>
      <a href="/passenger">Passenger</a>
      <a href="/controller">Controller</a>
      <a href="/login">Login</a>
    </div>
  </nav>

  <div style="max-width:560px; margin:60px auto; padding:0 20px">
    <div class="section">
      <h3>Contact Us</h3>
      <p style="color:#94a3b8; margin-bottom:20px">Have a question or issue? Send us a message.</p>
      <div class="form-group">
        <label>Your Name</label>
        <input type="text" placeholder="John Doe">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Message</label>
        <textarea rows="5" placeholder="Type your message here..."></textarea>
      </div>
      <button class="btn btn-primary" onclick="sendMsg()">Send Message</button>
      <div id="sent" style="margin-top:12px; color:#22c55e; display:none">Message sent! We'll get back to you shortly.</div>
    </div>
  </div>

  <footer>© 2026 TrainTrack AI. All rights reserved.</footer>

  <script>
    function sendMsg() {
      document.getElementById('sent').style.display = 'block';
    }
  </script>
</body>
</html>
